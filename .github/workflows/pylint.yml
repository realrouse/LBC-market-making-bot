name: Pylint

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.8 and 3.9 are EOL; test against actively supported versions.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v5.0.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install pylint and the bot's runtime dependencies so pylint can
        # resolve all imports (aiohttp, websockets, web3, py_clob_client).
        # web3 is listed explicitly because scripts/setup.py imports it
        # directly; py-clob-client also depends on it but may not always
        # pull it in as a top-level resolvable package.
        pip install pylint aiohttp websockets web3 py-clob-client
    - name: Analysing the code with pylint
      run: |
        pylint $(git ls-files '*.py')
