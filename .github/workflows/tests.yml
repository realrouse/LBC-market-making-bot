name: Tests

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
        # NON-editable: the repo root holds an outer `tradinetools/` dir (no __init__.py). Under
        # `python -m pytest` the repo root is on sys.path, so an editable install lets that dir
        # shadow the package as a namespace ("cannot import name … from 'tradinetools'"). A real
        # install into site-packages is a regular package and wins.
        pip install tradinetools/
    - name: Run tests
      # pytest per dir (matches scripts/run_tests.sh) so each subproject's conftest.py isolation
      # applies here too — the canonical runner and CI run the same thing.
      run: |
        python -m pytest tests/                         -p no:cacheprovider
        python -m pytest tradinetools/tests/            -p no:cacheprovider
        python -m pytest tradinebotte-cex/tests/        -p no:cacheprovider
        python -m pytest tradinebotte-polymarket/tests/ -p no:cacheprovider
        python -m pytest tradinebotte-indicators/tests/ -p no:cacheprovider
        python -m pytest tradinebotte-status/tests/     -p no:cacheprovider
