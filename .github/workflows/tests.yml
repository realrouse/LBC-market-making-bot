name: Tests

on: [push]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e tradinetools/
    - name: Run tests
      run: |
        python -m unittest discover -s tests                         -p "test_*.py" -v
        python -m unittest discover -s tradinetools/tests            -p "test_*.py" -v
        python -m unittest discover -s tradinebotte-cex/tests        -p "test_*.py" -v
        python -m unittest discover -s tradinebotte-polymarket/tests -p "test_*.py" -v
        python -m unittest discover -s tradinebotte-indicators/tests -p "test_*.py" -v
