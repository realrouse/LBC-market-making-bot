[project]
name = "tradinetools"
version = "0.1.0"
description = "Shared utilities for the tradinebotte ecosystem"
requires-python = ">=3.10"
dependencies = [
    "pyzmq",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tradinetools*"]
